spring.application.name=crm-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# OPAC integration — override with OPAC_BASE_URL env var in production
opac.base-url=${OPAC_BASE_URL:http://localhost:8082}
# Shared secret proving CRM->OPAC internal calls (e.g. admin password reset) are trusted;
# same value as OPAC's SSO_SHARED_SECRET, must be set to the same secret on both services.
internal.service-api-key=${INTERNAL_SERVICE_API_KEY:${SSO_SHARED_SECRET:}}

server.port=8085

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orque_crm}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# Redis cache
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.access-expiration=86400000
app.jwt.refresh-expiration=604800000

# Google Workspace — single OAuth connection covering Gmail, Calendar (+ Meet), and Tasks.
google.workspace.oauth.client-id=${GOOGLE_CLIENT_ID}
google.workspace.oauth.client-secret=${GOOGLE_CLIENT_SECRET}
google.workspace.oauth.redirect-uri=${GOOGLE_WORKSPACE_REDIRECT_URI}
google.workspace.oauth.scope=openid email profile https://www.googleapis.com/auth/gmail.modify https://www.googleapis.com/auth/gmail.send https://www.googleapis.com/auth/gmail.compose https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/calendar https://www.googleapis.com/auth/tasks
# AES key used to encrypt stored Google access/refresh tokens at rest — 32+ random chars.
google.token-encryption-key=${GOOGLE_TOKEN_ENCRYPTION_KEY}

# Frontend base URL — used to redirect the browser back after the Google OAuth dance
crm.app-url=${CRM_APP_URL:http://localhost:4300}

# SMTP transport — used by the per-tenant SMTP settings feature (SmtpConfigServiceImpl).
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Jackson Configuration
spring.jackson.deserialization.fail-on-unknown-properties=false

# License encryption
crm.license.secret=${CRM_LICENSE_SECRET}
crm.license.ivHex=${CRM_LICENSE_IV_HEX}

# CORS — comma-separated list of allowed frontend origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4300}